# Translation component: server response strings
# These are the ONLY translations the server sends directly in HTTP/WebSocket responses.
script_only = true

[errors]
not_found = "We couldn't find what you were looking for."
server_error = "A server error occurred. Please try again."

[rate_limiting]
generic = "You have made too many requests, please try again later."
account_creations = "Too many account creations are coming from this IP."
email_requests = "You have requested too many emails. Try again later."

[account] # Account-creation/validation responses the server alone emits (never needed client-side).
username_taken = "That username is taken"
username_reserved = "That username is reserved"
username_profane = "That username contains a word that is not allowed"
email_in_use = "This email is already in use"
email_blacklisted = "This address either can't receive mail, or is blacklisted."
email_domain_invalid = "Invalid domain."
no_pending_registration = "No pending registration found."

[auth]
invalid_credentials = "Incorrect username/email or password."
login_failed = "Login failed due to an internal server error. Please try again later."
login_retry_in_one = "Failed to login, try again in {n} second."
login_retry_in_other = "Failed to login, try again in {n} seconds."

[seeks]
already_in_game = "You are already in a game."
rated_requires_signin = "You must be signed in to play rated games."
game_aborted = "Game aborted."
cloud_requires_sign_in = "Must be signed in to create a seek from a cloud save."
cloud_not_found = "Cloud save not found."

[editor_saves] # Short reasons for why loading/saving a position failed
must_be_signed_in = "You must be signed in."
position_not_found = "That position no longer exists."
limit_reached = "You have reached your saved-position limit."
server_error = "A server error occurred."