name: Deploy

# Hands every push to `prod` to the private `infinitechess.org-deploy` repo,
# whose self-hosted runner deploys on the prod box. Never register a runner to
# this public repo: any PR could run workflows on it.
on:
  push:
    branches:
      - prod
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'

permissions: {}

jobs:
  dispatch:
    name: Trigger deploy
    runs-on: ubuntu-latest
    steps:
      # pull=true: back up the database, pull prod's latest code and reinstall dependencies.
      - name: Dispatch the private deploy workflow
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
        run: gh api repos/Infinite-Chess/infinitechess.org-deploy/actions/workflows/deploy.yml/dispatches -f ref=main -f 'inputs[pull]=true'
